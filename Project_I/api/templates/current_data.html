<!DOCTYPE html>

<html>

<head>

    <title>Current AQI</title>

    <link rel="stylesheet"
          href="/static/css/current.css">

</head>

<body>

<div class="container">

    <h1>Current Air Quality</h1>

    <div class="grid">

        <div class="card">
            <h3>PM2.5</h3>
            <p id="pm25">--</p>
        </div>

        <div class="card">
            <h3>PM10</h3>
            <p id="pm10">--</p>
        </div>

        <div class="card">
            <h3>AQI</h3>
            <p id="aqi">--</p>
        </div>

        <div class="card">
            <h3>Temperature</h3>
            <p id="temp">--</p>
        </div>

        <div class="card">
            <h3>Humidity</h3>
            <p id="humidity">--</p>
        </div>

        <div class="card">
            <h3>Wind Speed</h3>
            <p id="windspeed">--</p>
        </div>

        <div class="card">
            <h3>Visibility</h3>
            <p id="visibility">--</p>
        </div>

        <div class="card">
            <h3>Pressure</h3>
            <p id="pressure">--</p>
        </div>

    </div>

    <a href="/">← Back Home</a>

</div>

<script src="/static/js/current.js"></script>

</body>

</html>
